spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}

# allows Hibernate to generate SQL optimized for a particular relational database.
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect

# Flyway owns the schema. Hibernate only validates that the JPA entities match
# the tables Flyway has migrated to; it never adds or drops anything.
spring.jpa.hibernate.ddl-auto=validate

# Flyway. baseline-on-migrate=true lets Flyway adopt existing databases that
# already have the V1 schema without re-running the baseline script.
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1

# Cloudinary
cloudinary.cloud_name=${CLOUDINARY_CLOUD_NAME}
cloudinary.api_key=${CLOUDINARY_API_KEY}
cloudinary.api_secret=${CLOUDINARY_API_SECRET}

spring.mvc.pathmatch.matching-strategy=ant-path-matcher

# JWT signing secret. Must be provided via the JWT_SECRET environment variable
# and be at least 32 bytes long.
jwt.secret=${JWT_SECRET}

# JWT issuer and audience claims. Set per environment via env vars so tokens
# minted by one deployment cannot be replayed against another.
jwt.issuer=${JWT_ISSUER:shopping-website}
jwt.audience=${JWT_AUDIENCE:shopping-website-api}

# CORS allowed origins. Comma-separated list; defaults to the local frontend
# dev server. Override in each environment via APP_CORS_ALLOWED_ORIGINS.
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://localhost:3000}

# Multipart upload limits. spring.servlet.multipart bounds the raw request /
# per-file size at the Spring layer; app.upload.max-bytes is a second bound
# checked inside CloudinaryService before the temp file is written.
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB
app.upload.max-bytes=${APP_UPLOAD_MAX_BYTES:5242880}
