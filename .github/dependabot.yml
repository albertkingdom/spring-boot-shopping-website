version: 2

updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5

  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      frontend-minor-patch:
        update-types:
          - minor
          - patch
      frontend-security:
        applies-to: security-updates
        patterns:
          - "*"
    ignore:
      # React and web-vitals major upgrades require coordinated frontend migrations.
      - dependency-name: "react"
        update-types:
          - "version-update:semver-major"
      - dependency-name: "react-dom"
        update-types:
          - "version-update:semver-major"
      - dependency-name: "web-vitals"
        update-types:
          - "version-update:semver-major"

  - package-ecosystem: maven
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      maven-minor-patch:
        update-types:
          - minor
          - patch
      maven-security:
        applies-to: security-updates
        patterns:
          - "*"
    ignore:
      # Spring Boot and Springdoc major upgrades are separate framework migrations.
      - dependency-name: "org.springframework.boot:spring-boot-starter-parent"
        update-types:
          - "version-update:semver-major"
      - dependency-name: "org.springdoc:springdoc-openapi-starter-webmvc-ui"
        update-types:
          - "version-update:semver-major"
