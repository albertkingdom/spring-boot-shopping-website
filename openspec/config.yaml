schema: spec-driven

context: |
  這是 Spring Boot 3.3、Java 21、Maven、Spring Data JPA、Spring Security、MySQL、JWT、React、Bootstrap 與 Cloudinary 的單體電商專案。
  OpenSpec 的 living source of truth 位於 openspec/specs/；進行中的變更位於 openspec/changes/<name>/，完成後歸檔至 openspec/changes/archive/。
  專案自行撰寫的文件與驗收產出使用繁體中文；OpenSpec 固定結構關鍵字（Capability、Purpose、Requirements、Requirement、Scenario、GIVEN、WHEN、THEN）與 `.agents/skills/` 下的官方生成說明保留原文。source-code identifiers、API paths、JSON fields、commands 與 file paths 保留原文。
  遵守 AGENTS.md 的安全、分層、資料隔離、測試與 Git 規則。不得提交 secret、真實 credential、build output 或本機資料庫。
  新增或修改公開行為時，先以 change 的 delta specs 定義 WHAT，再以 design.md 定義 HOW，tasks.md 只追蹤可驗證的實作工作。

rules:
  proposal:
    - 明確寫出 intent、scope、non-goals、相容性與 rollout/rollback 風險；不要把 implementation checklist 放進 proposal。
  specs:
    - 使用 ADDED、MODIFIED、REMOVED 或 RENAMED Requirements 表達相對於 openspec/specs/ 的變更。
    - 每個 Requirement 必須描述可觀察行為，並至少包含可自動測試或人工驗證的 Scenario。
    - 涉及 API、權限、資料、錯誤或驗收的內容必須寫出輸入、輸出、狀態碼與安全邊界。
  design:
    - 說明架構決策、替代方案、風險與 migration/rollback；不要重複 proposal 或逐行描述程式碼。
  tasks:
    - 任務依相依關係排序，使用可追蹤的 Markdown checkbox；只有完成實作與必要證據後才能勾選。
    - 任務必須包含受影響的 code、tests、docs、configuration 與 final validation，不得只列功能程式碼。

operations:
  apply:
    guidance:
      - 開始前確認 change status 與未提交變更；每完成一個可獨立驗證的任務就執行最小相關測試並更新 checkbox。
      - 需求、API、資料模型、權限或風險改變時先更新 change artifacts，再繼續實作。
  archive:
    guidance:
      - 歸檔前確認 tasks 全部完成、delta specs 已同步至 openspec/specs/，並保留驗收證據與已知限制。
