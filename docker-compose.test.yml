services:
  mysqldb:
    image: mysql:8.0
    environment:
      MYSQL_DATABASE: shopping_website
      MYSQL_USER: shopping
      MYSQL_PASSWORD: shopping-ci-password
      MYSQL_ROOT_PASSWORD: root-ci-password
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p\"$$MYSQL_ROOT_PASSWORD\" --silent"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s

  test:
    image: eclipse-temurin:21-jdk
    depends_on:
      mysqldb:
        condition: service_healthy
    environment:
      MAVEN_OPTS: -XX:+EnableDynamicAgentLoading
      MAVEN_GOAL: ${MAVEN_GOAL:-test}
      SPRING_DATASOURCE_URL: jdbc:mysql://mysqldb:3306/shopping_website?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      SPRING_DATASOURCE_USERNAME: shopping
      SPRING_DATASOURCE_PASSWORD: shopping-ci-password
      CLOUDINARY_CLOUD_NAME: ci-placeholder
      CLOUDINARY_API_KEY: ci-placeholder
      CLOUDINARY_API_SECRET: ci-placeholder
      JWT_SECRET: ci-jwt-secret-placeholder-at-least-32-bytes
      JWT_ISSUER: shopping-ci
      JWT_AUDIENCE: shopping-ci-api
      SPRING_PROFILES_ACTIVE: dev
    volumes:
      - ./:/source:ro
    tmpfs:
      - /workspace
    working_dir: /workspace
    command:
      - sh
      - -ec
      - |
        cp -a /source/.mvn /source/mvnw /source/pom.xml /source/src /workspace/
        sh ./mvnw --batch-mode --no-transfer-progress "$$MAVEN_GOAL"
