stages:
  - testing
  - build
  - publish

run-tests:
  stage: testing
  script:
    - echo "run-tests"

build-docker-image:
  stage: build
  tags:
    - aws
  script:
    - docker build -t $CI_REGISTRY_IMAGE:1.0 . #
    - docker images

push-to-registry:
  stage: publish
  tags:
    - aws
  needs:
    - build-docker-image
  before_script:
    - docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY #login gitlab registry
  script:
    - docker push $CI_REGISTRY_IMAGE:1.0

