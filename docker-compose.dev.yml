services:
  mysqldb:
    ports:
      - "127.0.0.1:3306:3306"

  spring:
    build: .
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: dev

  phpmyadmin:
    image: phpmyadmin:5.2.1-apache
    depends_on:
      mysqldb:
        condition: service_healthy
    restart: unless-stopped
    ports:
      - "127.0.0.1:8888:8080"
    environment:
      PMA_HOST: mysqldb

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.prod
    ports:
      - "127.0.0.1:80:80"
